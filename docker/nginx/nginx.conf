events {}

http {
  include       /etc/nginx/mime.types;
  sendfile      on;
  client_max_body_size 12m;   # archivos de los alumnos (máx. 10 MB)

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    # Contraseña del navegador (opcional): crea docker/nginx/.htpasswd,
    # descomenta estas dos líneas y monta el archivo en docker-compose.yml
    # auth_basic           "Laboratorio Virtual ADS";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # Telemetría y datos crudos en vivo (Server-Sent Events) sin búfer
    location ~ ^/api/(stream|eco) {
      proxy_pass http://web:5000;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
    }

    # Video MJPEG sin búfer
    location /stream/ {
      proxy_pass http://web:5000;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }

    # Terminal de prácticas (ttyd, WebSocket)
    location /terminal/ {
      proxy_pass http://terminal:7681;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }
    location = /terminal { return 301 /terminal/; }

    location / {
      proxy_pass http://web:5000;
      proxy_http_version 1.1;
    }
  }
}
